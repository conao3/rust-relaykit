[package]
name = "relaykit"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Language-neutral communication gateway for AI agents"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
